services:
  mysql:
    image: mysql:8
    restart: always
    environment:
      # 密码必须通过 .env 提供（无默认值——公开仓库不带可部署默认凭据）
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: campus_rag
      MYSQL_USER: campus
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  reranker:
    build:
      context: ./reranker_service
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple   # 国内构建镜像加速
    image: campus-rag-reranker
    environment:
      RERANKER_MODEL_DIR: /models/bge-reranker-v2-m3
    volumes:
      - /home/stud1/models/reranker:/models/bge-reranker-v2-m3
    ports:
      - "8002:8002"
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # 自建镜像 campus-rag-embedding（已在部署机构建）；迁入 compose 以便 backend
  # 经服务名访问，同时保留宿主端口 8001 映射——pipeline 宿主进程走 localhost:8001
  embedding:
    image: campus-rag-embedding
    environment:
      BGE_M3_DIR: /models/bge-m3
    volumes:
      - /home/stud1/models/bge-m3:/models/bge-m3
    ports:
      - "8001:8001"
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Ollama 容器化：复用宿主已下载模型（~/ollama_models），解决其仅监听 127.0.0.1
  # 无法被容器访问的问题；宿主 ollama CLI 仍可用（端口映射保留）
  ollama:
    image: ollama/ollama:latest
    volumes:
      - /home/stud1/ollama_models:/root/.ollama/models
    ports:
      - "11434:11434"
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple

    environment:
      LLM_URL: http://ollama:11434
      LLM_MODEL: qwen3:8b
      EMBED_URL: http://embedding:8001
      RERANK_URL: http://reranker:8002
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: campus_kb
      # DB_URL 整体经 .env 注入（密码含 % 需 URL 编码 %25，明文插值会解码失败）
      DB_URL: ${DB_URL:?set in .env as mysql+pymysql://campus:ENCODED_PWD@mysql:3306/campus_rag?charset=utf8mb4}
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      - ollama
      - embedding
      - reranker
      - qdrant
      - mysql

volumes:
  mysql_data:
  qdrant_data:

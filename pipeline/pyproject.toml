[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-rag-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "crawl4ai>=0.7",
    "trafilatura>=1.8",
    "pymupdf>=1.24",
    "qdrant-client>=1.10",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
